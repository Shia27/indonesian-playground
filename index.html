<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Escape the Backrooms</title>
<style>
:root{
  --yellow:#e6d36f; --paper:#f3e9ad; --dark:#151611; --panel:#1b1c16;
  --floor:#aaa66e; --floor2:#b5b17a; --wall:#65674b; --green:#7f9855;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0d0e0b;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;touch-action:manipulation}
.app{width:min(100%,920px);margin:auto;padding:10px}
.header{
 background:var(--panel);border:2px solid #3b3c2d;border-radius:15px;
 padding:10px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px;
 box-shadow:0 8px 24px #0009
}
.brand{display:flex;align-items:center;gap:9px}.brandIcon{font-size:30px}
.title{font-weight:1000;font-size:clamp(21px,4vw,31px);line-height:1}
.subtitle{font-size:9px;color:#c6c39a;letter-spacing:.08em;margin-top:4px}
.mission{background:var(--yellow);color:#25261c;padding:7px 10px;border-radius:7px;text-align:center;font-weight:950;font-size:11px}
.mission span{display:block;font-size:9px;margin-top:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:9px;margin-top:9px}
.panel{background:var(--panel);border:2px solid #3b3c2d;border-radius:12px;padding:8px;box-shadow:0 8px 24px #0009}
.mazeWrap{background:#25261b;border-radius:8px;padding:4px}
.maze{
 width:100%;aspect-ratio:1;display:grid;
 grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(12,1fr);gap:2px
}
.tile{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--floor)}
.tile:nth-child(even){background:var(--floor2)}
.tile.wall{background:var(--wall)}
.tile.wall:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#55573f22 0 10px,transparent 10px 21px)}
.tile img{width:78%;height:78%;object-fit:contain;position:relative;z-index:2}
.tile.exit{background:var(--green)}
.tile.monsterNear{background:#91504a;animation:pulse .55s infinite alternate}
@keyframes pulse{to{filter:brightness(1.2)}}
.info{display:flex;flex-direction:column;gap:8px}
.objective{background:#28291e;border-radius:9px;padding:10px;text-align:center;font-weight:900}
.objective b{color:#eee3a0}.status{
 min-height:52px;background:#28291e;border-radius:9px;padding:9px;
 display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:850
}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ctrl{min-height:60px;border:0;border-radius:10px;background:var(--paper);color:#28281e;font-weight:1000;font-size:clamp(11px,2vw,15px);box-shadow:0 3px #a79b55;cursor:pointer}
.ctrl:active{transform:translateY(2px);box-shadow:0 1px #a79b55}
.stop{grid-column:1/-1;background:#ddd49a}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px;font-weight:800}
.hud div{background:#28291e;border-radius:8px;padding:7px;text-align:center}
.result{min-height:38px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:950}
.win,.lose{padding:9px;border-radius:8px;width:100%}.win{background:#718b50}.lose{background:#8b3b33}
.reset{width:100%;border:0;border-radius:9px;background:var(--yellow);color:#28281d;padding:9px;font-weight:950;cursor:pointer}
.tip{font-size:9px;color:#969783;text-align:center}
@media(max-width:700px){.main{grid-template-columns:1fr}.info{order:2}.header{align-items:flex-start}.mission{min-width:110px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="brand">
    <div class="brandIcon">🏃</div>
    <div>
      <div class="title">ESCAPE THE BACKROOMS</div>
      <div class="subtitle">GUNAKAN BAHASA INDONESIA UNTUK KELUAR</div>
    </div>
  </div>
  <div class="mission">MISI 1<span>TEMUKAN PINTU KELUAR</span><span>Hati-hati dengan monster!</span></div>
</header>

<main class="main">
<section class="panel">
  <div class="mazeWrap"><div id="maze" class="maze"></div></div>
</section>

<section class="panel info">
  <div class="objective">🚪 TUJUAN: <b>CAPAI PINTU KELUAR</b></div>
  <div id="status" class="status">Cari pintu keluar dan hindari semua monster!</div>

  <div class="hud">
    <div>👤 MONSTER: <span id="monsterCount">3</span></div>
    <div>👣 LANGKAH: <span id="steps">0</span></div>
  </div>

  <div class="controls">
    <button class="ctrl" data-action="up">MAJU</button>
    <button class="ctrl" data-action="down">MUNDUR</button>
    <button class="ctrl" data-action="left">KIRI</button>
    <button class="ctrl" data-action="right">KANAN</button>
    <button class="ctrl stop" data-action="stop">BERHENTI</button>
  </div>

  <div id="result" class="result"></div>
  <button id="reset" class="reset">↻ COBA LAGI</button>
  <div class="tip">Ingat: MAJU · MUNDUR · KIRI · KANAN · BERHENTI</div>
</section>
</main>
</div>

<script>
const SIZE=12;

/*
  # = wall
  . = floor
  P = player start
  E = exit
  M = monster start

  This map is intentionally designed so the floor area is connected.
  There is no forced command sequence, so children can explore freely.
*/
const MAP=[
"P...........",
".###.#####..",
"...#.....#..",
".#.#.###.#..",
".#...#...#..",
".###.#.###..",
".....#......",
".#####.####.",
".....#......",
".###.#.###..",
"...#.....#..",
"...########E"
];

const INITIAL_MONSTERS=[
 {r:2,c:7},
 {r:6,c:10},
 {r:8,c:4}
];

let player={r:0,c:0};
let monsters=[];
let steps=0;
let gameOver=false;
let escaped=false;
let stopped=false;

const maze=document.getElementById("maze");
const status=document.getElementById("status");
const result=document.getElementById("result");
const stepEl=document.getElementById("steps");
const monsterCount=document.getElementById("monsterCount");

function isWall(r,c){
  return r<0||r>=SIZE||c<0||c>=SIZE||MAP[r][c]==="#";
}

function resetGame(){
  player={r:0,c:0};
  monsters=INITIAL_MONSTERS.map(m=>({...m}));
  steps=0;
  gameOver=false;
  escaped=false;
  stopped=false;
  status.textContent="Cari pintu keluar dan hindari semua monster!";
  result.innerHTML="";
  render();
}

function render(){
  maze.innerHTML="";

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const tile=document.createElement("div");
      tile.className="tile";

      if(isWall(r,c)) tile.classList.add("wall");

      if(r===11 && c===11){
        tile.classList.add("exit");
        tile.innerHTML='<img src="assets/door.svg" alt="Pintu keluar">';
      }

      if(r===8 && c===2){
        tile.innerHTML='<img src="assets/crate.svg" alt="">';
      }

      const monsterIndex=monsters.findIndex(m=>m.r===r&&m.c===c);

      if(monsterIndex>=0){
        const m=monsters[monsterIndex];
        const distance=Math.abs(player.r-m.r)+Math.abs(player.c-m.c);
        if(distance<=2) tile.classList.add("monsterNear");
        tile.innerHTML='<img src="assets/monster.svg" alt="Monster">';
      }

      if(r===player.r&&c===player.c){
        tile.innerHTML='<img src="assets/player.svg" alt="Pemain">';
      }

      maze.appendChild(tile);
    }
  }

  stepEl.textContent=steps;
  monsterCount.textContent=monsters.length;
}

function caught(){
  gameOver=true;
  result.innerHTML='<div class="lose">👹 TERTANGKAP! Coba lagi.</div>';
  status.textContent="Monster menang! Kamu tertangkap.";
  render();
}

function escapedGame(){
  escaped=true;
  result.innerHTML='<div class="win">🚪 KAMU BERHASIL KELUAR!</div>';
  status.textContent="🎉 Berhasil! Kamu menemukan pintu keluar!";
  render();
}

function moveMonsters(){
  /*
    Monsters move every 2 player steps.
    They move one square toward the player when possible.
    They never walk through walls.
  */
  if(steps%2!==0 || stopped) return;

  monsters=monsters.map(monster=>{
    const candidates=[
      {r:monster.r-1,c:monster.c},
      {r:monster.r+1,c:monster.c},
      {r:monster.r,c:monster.c-1},
      {r:monster.r,c:monster.c+1}
    ].filter(p=>!isWall(p.r,p.c));

    candidates.sort((a,b)=>{
      const da=Math.abs(a.r-player.r)+Math.abs(a.c-player.c);
      const db=Math.abs(b.r-player.r)+Math.abs(b.c-player.c);
      return da-db;
    });

    return candidates[0]||monster;
  });

  if(monsters.some(m=>m.r===player.r&&m.c===player.c)) caught();
}

function move(action){

  if(gameOver||escaped) return;

  if(action==="stop"){
    /*
      BERHENTI has a real gameplay function:
      it pauses monster movement for the next player move.
    */
    stopped=true;
    status.textContent="🛑 BERHENTI. Tenang... monster tidak bergerak sekarang.";
    render();
    return;
  }

  const delta={
    up:[-1,0],
    down:[1,0],
    left:[0,-1],
    right:[0,1]
  }[action];

  if(!delta) return;

  const nr=player.r+delta[0];
  const nc=player.c+delta[1];

  if(isWall(nr,nc)){
    status.textContent="🧱 Tembok! Cari jalan lain.";
    return;
  }

  player={r:nr,c:nc};
  steps++;

  if(player.r===11&&player.c===11){
    escapedGame();
    return;
  }

  if(monsters.some(m=>m.r===player.r&&m.c===player.c)){
    caught();
    return;
  }

  if(stopped){
    stopped=false;
    status.textContent="▶️ Jalan lagi. Hati-hati dengan monster!";
  }else{
    moveMonsters();
  }

  if(!gameOver){
    const nearby=monsters.some(m=>Math.abs(player.r-m.r)+Math.abs(player.c-m.c)<=2);
    status.textContent=nearby
      ?"👀 MONSTER DEKAT! Lari!"
      :"Cari pintu keluar...";
  }

  render();
}

document.querySelectorAll("[data-action]").forEach(button=>{
  button.addEventListener("click",()=>move(button.dataset.action));
});

document.getElementById("reset").addEventListener("click",resetGame);

resetGame();
</script>
</body>
</html>
